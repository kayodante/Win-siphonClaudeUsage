name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A new push to a PR cancels that PR's run still in progress. Pushes to main
# never cancel each other, so every commit on main keeps its own result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  # Rust core logic (parsing, pricing, PKCE, quota, preferences, scheduler).
  # Cross-platform and free of Tauri/Windows deps, so it runs fast on Linux.
  # rustup ships on the hosted runners, so no third-party setup action is needed.
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable

      # Pinned to a commit SHA (tags can be moved); Dependabot bumps it.
      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Format check
        working-directory: src-tauri/crates/siphon-core
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri/crates/siphon-core
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri/crates/siphon-core
        run: cargo test

  # The Windows app crate (tray, WebView2, DPAPI, process listing, the
  # loopback client). Compile-only: its logic is tested through siphon-core
  # above, and it does not pass `cargo fmt --check` (pre-existing drift).
  tauri-check:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri

      - name: Check
        working-directory: src-tauri
        run: cargo check --locked
