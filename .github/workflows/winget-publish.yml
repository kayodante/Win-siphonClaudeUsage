name: Publish to winget

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  winget:
    runs-on: windows-latest
    steps:
      # Event data and secrets reach the scripts as environment variables, never
      # interpolated into the script text, so they cannot inject commands.
      - name: Compute version and installer URL
        id: vars
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
          REPO: ${{ github.repository }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $url = "https://github.com/$env:REPO/releases/download/$env:TAG/Siphon.Setup.$version.exe"
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "url=$url" >> $env:GITHUB_OUTPUT

      - name: Install wingetcreate
        shell: pwsh
        run: iwr https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe

      - name: Submit updated manifest to winget-pkgs
        shell: pwsh
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          URL: ${{ steps.vars.outputs.url }}
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        run: |
          .\wingetcreate.exe update kayodante.Siphon `
            --version $env:VERSION `
            --urls "$env:URL|x64" `
            --submit `
            --token $env:WINGET_TOKEN
